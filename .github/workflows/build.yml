name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Check axioms
        run: |
          printf 'import RHLindelof\n#print axioms RHLindelof.lindelof_of_riemannHypothesis\n' > Axioms.lean
          lake env lean Axioms.lean | tee axioms.txt
          grep -q "depends on axioms: \[propext, Classical.choice, Quot.sound\]" axioms.txt
